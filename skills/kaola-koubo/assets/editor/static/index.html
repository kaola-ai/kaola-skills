<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>剪口播编辑器</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="title">剪口播编辑器</div>
    <label class="project-switcher">
      <span>原片</span>
      <select id="project-select" aria-label="切换原片"></select>
    </label>
    <div class="source-name" id="source-name"></div>
    <div class="actions">
      <button id="btn-preview" class="toggle off">预览剪后：关</button>
      <button id="btn-export">导出 JSON</button>
      <button id="btn-save">保存</button>
      <button id="btn-render" class="primary">渲染成片</button>
      <a id="btn-download-top" class="button primary hidden" download>下载成片</a>
    </div>
  </header>

  <section class="player-row">
    <div class="player-col">
      <video id="video" preload="metadata"></video>
      <div class="controls">
        <button id="btn-play" title="空格">▶</button>
        <span id="time" class="time">00:00 / 00:00</span>
        <label class="rate">倍速
          <select id="rate">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <span id="cut-duration" class="cut-dur">剪后 00:00</span>
        <span class="hint">←/→ 快退快进 · 空格 播放</span>
      </div>
    </div>
  </section>

  <section class="timeline-wrap">
    <div class="timeline-label">
      <span>时间轴</span>
      <span class="legend"><i class="sw keep"></i>保留 <i class="sw cut"></i>剪掉</span>
      <span class="bulk-actions">
        <button id="btn-keep-all" title="将整条原片设为保留">一键全部保留</button>
        <button id="btn-clear-all" class="danger" title="清空所有保留片段">一键全部清除</button>
      </span>
    </div>
    <div class="timeline-box">
      <div id="timeline" class="timeline"></div>
      <div id="playhead" class="playhead"></div>
      <div id="time-tip" class="time-tip hidden"></div>
    </div>
  </section>

  <section class="text-editor-wrap">
    <div class="text-editor-head">
      <div>
        <h2>按文字剪辑</h2>
        <p>拖选下面的转写文字，点“剪掉/恢复”会按 0.01 秒逐字时间线处理；剪掉时只扣选中文字，不再向后吞字。</p>
      </div>
      <div class="text-editor-actions">
        <span id="text-selection-count" class="count">未选择文字</span>
        <button id="btn-play-selected" title="播放选中文字对应片段">播放选中</button>
        <button id="btn-cut-selected" class="danger" title="剪掉选中文字对应的视频">剪掉选中文字</button>
        <button id="btn-keep-selected" class="primary" title="恢复/保留选中文字对应的视频">恢复选中文字</button>
      </div>
    </div>
    <div id="text-editor" class="text-editor" aria-label="按文字剪辑区"></div>
  </section>

  <section class="main-row">
    <div class="panel transcript-panel">
      <div class="panel-head">
        <h2>转写列表</h2>
        <span id="seg-count" class="count"></span>
      </div>
      <div id="transcript" class="transcript"></div>
    </div>
    <div class="panel preview-panel">
      <div class="panel-head"><h2>剪后文稿</h2><span class="count" id="kept-count"></span></div>
      <div id="cut-text" class="cut-text"></div>
      <div class="clip-list-head">
        <strong>保留片段</strong>
        <span id="clip-count" class="count"></span>
      </div>
      <div id="clip-list" class="clip-list"></div>
    </div>
  </section>
</div>

<!-- 渲染弹窗 -->
<div id="render-modal" class="modal hidden">
  <div class="modal-box">
    <h3>渲染成片</h3>
    <div id="render-status" class="render-status">准备中…</div>
    <pre id="render-log" class="render-log"></pre>
    <div class="modal-actions">
      <button id="btn-play-output" class="primary hidden">播放成片</button>
      <button id="btn-render-close">关闭</button>
    </div>
  </div>
</div>

<!-- 成片播放弹窗 -->
<div id="output-modal" class="modal hidden">
  <div class="modal-box large">
    <h3>成片预览</h3>
    <video id="output-video" controls></video>
    <div class="modal-actions">
      <a id="btn-download" class="button" download>下载成片</a>
      <button id="btn-output-close">关闭</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
